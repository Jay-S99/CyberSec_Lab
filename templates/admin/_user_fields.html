<div>
  <label for="username">Username</label>
  <input id="username" name="username" type="text" value="{{ values.username }}" autocomplete="off" maxlength="64" required{% if locked_username %} readonly aria-describedby="protected-account-note"{% endif %}>
</div>
<div>
  <label for="role_id">Assigned role</label>
  <select id="role_id" name="role_id" required{% if locked_role %} disabled aria-describedby="protected-account-note"{% endif %}>
    <option value="">Select a role</option>
    {% for role in roles %}
      <option value="{{ role.id }}"{% if values.role_id|string == role.id|string %} selected{% endif %}>{{ role.name|title }}</option>
    {% endfor %}
  </select>
  {% if locked_role %}<input type="hidden" name="role_id" value="{{ values.role_id }}">{% endif %}
</div>
