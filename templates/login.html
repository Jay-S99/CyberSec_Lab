{% extends "base.html" %}
{% block title %}Sign in - DoomVault{% endblock %}
{% block content %}
<h1>DoomVault</h1>
<h2>Sign in</h2>
{% if notice %}
  <p role="status">{{ notice }}</p>
{% endif %}
{% if errors %}
  <div role="alert">
    {% for error in errors %}
      <p>{{ error }}</p>
    {% endfor %}
  </div>
{% endif %}
<form method="post" action="{{ url_for('auth.login') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div>
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64" required>
  </div>
  <div>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
  </div>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
